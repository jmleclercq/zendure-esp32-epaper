# Zendure SolarFlow 2400 Pro e-paper dashboard
# ESP32-C3 + Waveshare e-Paper 1,54" V2 (200x200) + Home Assistant
#
# 1. Copy secrets.example.yaml to secrets.yaml and fill it in
# 2. Adapt the Home Assistant entities in the "substitutions" block
# 3. esphome run zendure-epaper.yaml

substitutions:
  name: zendure-epaper
  friendly_name: Zendure e-Paper

  # --- Home Assistant entities (adapt to your installation) ------------------
  # The names below are examples: check them in
  # Developer tools > States.
  solar_entity: sensor.solarflow_2400_pro_solar_input_power
  mppt1_entity: sensor.solarflow_2400_pro_solar_power1
  mppt2_entity: sensor.solarflow_2400_pro_solar_power2
  mppt3_entity: sensor.solarflow_2400_pro_solar_power3
  mppt4_entity: sensor.solarflow_2400_pro_solar_power4
  # Power the SolarFlow delivers to the house (W); home = grid import + this
  sf_output_entity: sensor.solarflow_2400_pro_output_home_power
  battery_soc_entity: sensor.solarflow_2400_pro_electric_level  # battery level (%)
  battery_power_entity: sensor.solarflow_2400_pro_bat_in_out # battery power (W)
  grid_entity: sensor.lixee_zlinky_tic_papp               # Linky apparent power (VA), import only

  # Sign conventions (set to -1 to invert)
  # battery_power_sign: 1 => positive = charging, negative = discharging
  # grid_power_sign:    1 => positive = import, negative = export
  battery_power_sign: "-1"
  grid_power_sign: "1"

  # Display refresh period
  refresh_interval: 5min

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Many ESP32-C3 boards (e.g. SuperMini) have trouble associating at full
  # TX power; lowering it and disabling power save makes the link reliable.
  output_power: 8.5dB
  power_save_mode: none
  ap:
    ssid: "${name} Fallback"
    password: !secret ap_password

captive_portal:

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      then:
        # wait for the first values from Home Assistant before drawing
        - delay: 30s
        - component.update: epaper

# --- Data ------------------------------------------------------------------
sensor:
  - platform: homeassistant
    id: solar_power
    entity_id: ${solar_entity}
  - platform: homeassistant
    id: mppt1
    entity_id: ${mppt1_entity}
  - platform: homeassistant
    id: mppt2
    entity_id: ${mppt2_entity}
  - platform: homeassistant
    id: mppt3
    entity_id: ${mppt3_entity}
  - platform: homeassistant
    id: mppt4
    entity_id: ${mppt4_entity}
  - platform: homeassistant
    id: sf_output_power
    entity_id: ${sf_output_entity}
    on_value:
      then:
        - component.update: home_power
  - platform: homeassistant
    id: battery_soc
    entity_id: ${battery_soc_entity}
  - platform: homeassistant
    id: battery_power
    entity_id: ${battery_power_entity}
  - platform: homeassistant
    id: grid_power
    entity_id: ${grid_entity}
    on_value:
      then:
        - component.update: home_power

  # Home consumption = grid import (Linky) + power delivered by the SolarFlow
  - platform: template
    id: home_power
    name: "Home power"
    unit_of_measurement: "W"
    accuracy_decimals: 0
    update_interval: never
    on_value:
      then:
        - component.update: solar_coverage
    lambda: |-
      float grid = id(grid_power).state * ${grid_power_sign};
      float sf = id(sf_output_power).state;
      if (isnan(grid) || isnan(sf)) return NAN;
      return (grid > 0 ? grid : 0) + sf;

  # Solar coverage = share of the home consumption supplied by the SolarFlow
  # (solar production, directly or through the battery)
  - platform: template
    id: solar_coverage
    name: "Solar coverage"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: never
    lambda: |-
      float home = id(home_power).state;
      float sf = id(sf_output_power).state;
      if (isnan(home) || isnan(sf) || home < 1) return NAN;
      float v = sf / home * 100.0f;
      if (v < 0) v = 0;
      if (v > 100) v = 100;
      return v;

button:
  - platform: template
    name: "Refresh display"
    on_press:
      - component.update: epaper

# --- Display --------------------------------------------------------------------
font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 12
  - file: "gfonts://Roboto"
    id: font_medium
    size: 16
  - file: "gfonts://Roboto@700"
    id: font_big
    size: 28

spi:
  clk_pin: GPIO4
  mosi_pin: GPIO6

display:
  - platform: waveshare_epaper
    id: epaper
    model: 1.54inv2
    cs_pin: GPIO7
    dc_pin: GPIO10
    reset_pin: GPIO3
    busy_pin: GPIO5
    full_update_every: 1
    update_interval: ${refresh_interval}
    rotation: 0
    lambda: |-
      auto fmt = [](float v, const char *f) -> std::string {
        if (isnan(v)) return std::string("--");
        char b[16];
        snprintf(b, sizeof(b), f, v);
        return std::string(b);
      };

      // Header
      it.print(2, 0, id(font_medium), "SolarFlow");
      it.strftime(198, 0, id(font_medium), TextAlign::TOP_RIGHT, "%H:%M", id(ha_time).now());
      it.line(0, 19, 199, 19);

      // Production / Home consumption
      it.print(50, 22, id(font_small), TextAlign::TOP_CENTER, "PRODUCTION");
      it.printf(50, 36, id(font_big), TextAlign::TOP_CENTER, "%s", fmt(id(solar_power).state, "%.0f").c_str());
      it.print(50, 66, id(font_small), TextAlign::TOP_CENTER, "W");
      it.print(150, 22, id(font_small), TextAlign::TOP_CENTER, "HOME");
      it.printf(150, 36, id(font_big), TextAlign::TOP_CENTER, "%s", fmt(id(home_power).state, "%.0f").c_str());
      it.print(150, 66, id(font_small), TextAlign::TOP_CENTER, "W");
      it.line(100, 22, 100, 80);
      it.line(0, 82, 199, 82);

      // Four MPPTs
      const char *labels[4] = {"M1", "M2", "M3", "M4"};
      float mppt[4] = {id(mppt1).state, id(mppt2).state, id(mppt3).state, id(mppt4).state};
      for (int i = 0; i < 4; i++) {
        int x = 25 + i * 50;
        it.print(x, 85, id(font_small), TextAlign::TOP_CENTER, labels[i]);
        it.printf(x, 98, id(font_medium), TextAlign::TOP_CENTER, "%s", fmt(mppt[i], "%.0f").c_str());
        if (i > 0) it.line(i * 50, 85, i * 50, 117);
      }
      it.line(0, 120, 199, 120);

      // Battery
      float soc = id(battery_soc).state;
      float bp = id(battery_power).state * ${battery_power_sign};
      if (bp == 0) bp = 0;  // avoid printing "-0"
      it.print(2, 123, id(font_small), "BATTERY");
      it.printf(2, 136, id(font_medium), "%s%%", fmt(soc, "%.0f").c_str());
      it.printf(198, 136, id(font_medium), TextAlign::TOP_RIGHT, "%s W", fmt(bp, "%+.0f").c_str());
      it.rectangle(2, 156, 196, 10);
      if (!isnan(soc)) it.filled_rectangle(2, 156, (int) (196 * soc / 100.0f), 10);
      it.line(0, 170, 199, 170);

      // Solar coverage
      float sc = id(solar_coverage).state;
      it.print(2, 173, id(font_small), "SOLAR COVERAGE");
      it.printf(198, 172, id(font_medium), TextAlign::TOP_RIGHT, "%s%%", fmt(sc, "%.0f").c_str());
      it.rectangle(2, 189, 196, 9);
      if (!isnan(sc)) it.filled_rectangle(2, 189, (int) (196 * sc / 100.0f), 9);
