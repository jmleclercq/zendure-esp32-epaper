name: Compile ESPHome

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install esphome
      - name: Préparer secrets.yaml factice
        working-directory: esphome
        run: cp secrets.example.yaml secrets.yaml
      - name: Compiler
        working-directory: esphome
        run: esphome compile zendure-epaper.yaml
