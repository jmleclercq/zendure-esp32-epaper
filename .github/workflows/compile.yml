name: Compile ESPHome

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ESPHOME_VERSION: "2026.10.2"

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/compile.yml
      - run: pip install "esphome==${ESPHOME_VERSION}"
      - name: Prepare dummy secrets.yaml
        working-directory: esphome
        run: cp secrets.example.yaml secrets.yaml
      - name: Compile
        working-directory: esphome
        run: esphome compile zendure-epaper.yaml
